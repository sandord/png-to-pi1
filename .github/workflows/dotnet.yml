
name: .NET

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src
      - name: Build
        run: dotnet build --no-restore
        working-directory: ./src
      - name: Test
        run: dotnet test --no-build --verbosity normal
        working-directory: ./src

  release:

    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish Linux x64
        run: dotnet publish PngToPi1/PngToPi1.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o ./publish/linux-x64
        working-directory: ./src
      - name: Publish Windows x64
        run: dotnet publish PngToPi1/PngToPi1.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ./publish/win-x64
        working-directory: ./src
      - name: Publish macOS x64
        run: dotnet publish PngToPi1/PngToPi1.csproj -c Release -r osx-x64 --self-contained -p:PublishSingleFile=true -o ./publish/osx-x64
        working-directory: ./src
      - name: Package Linux x64
        run: |
          cd src/publish/linux-x64
          zip -r ../../../PngToPi1-linux-x64.zip .
      - name: Package Windows x64
        run: |
          cd src/publish/win-x64
          zip -r ../../../PngToPi1-win-x64.zip .
      - name: Package macOS x64
        run: |
          cd src/publish/osx-x64
          zip -r ../../../PngToPi1-osx-x64.zip .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PngToPi1-linux-x64.zip
            PngToPi1-win-x64.zip
            PngToPi1-osx-x64.zip
          draft: false
          prerelease: false