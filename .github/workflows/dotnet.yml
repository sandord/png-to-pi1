name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./src
    - name: Build
      run: dotnet build --no-restore
      working-directory: ./src
    - name: Test
      run: dotnet test --no-build --verbosity normal
      working-directory: ./src

  release:

    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish Linux x64
        run: dotnet publish -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o ./publish/linux-x64
        working-directory: ./src
      - name: Publish Windows x64
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ./publish/win-x64
        working-directory: ./src
      - name: Publish macOS x64
        run: dotnet publish -c Release -r osx-x64 --self-contained -p:PublishSingleFile=true -o ./publish/osx-x64
        working-directory: ./src
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: src/publish/linux-x64
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: src/publish/win-x64
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-osx-x64
          path: src/publish/osx-x64